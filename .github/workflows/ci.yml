name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          XQL_DIFFERENTIAL_SEEDS: "250"
      - run: npm run build
      - run: npm pack --dry-run

  type-performance:
    name: type-performance (${{ matrix.count }} queries)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        count: [100, 1000, 5000, 10000, 25000]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build published type surface
        run: npm run build
      - name: Benchmark baseline vs compiled XQL
        run: >-
          npm run bench:types --
          --counts ${{ matrix.count }}
          --modes baseline,compiled
          --xql-entry ../../dist/index.d.ts
      - name: Enforce type-performance budgets
        run: npm run bench:types:assert -- --count ${{ matrix.count }}

  compiler-performance:
    name: compiler-performance (${{ matrix.count }} queries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        count: [100, 1000, 5000, 10000, 25000]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install real PostgreSQL parser for compiler benchmark
        run: npm install --no-save --package-lock=false libpg-query@17.7.4
      - name: Benchmark XQL compiler
        run: npm run bench:compiler -- --counts ${{ matrix.count }}
      - name: Enforce compiler-performance budgets
        run: npm run bench:compiler:assert -- --count ${{ matrix.count }}

  query-edit-performance:
    name: query-edit-performance (25,000 queries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install real PostgreSQL parser
        run: npm install --no-save --package-lock=false libpg-query@17.7.4
      - name: Build published type surface
        run: npm run build
      - name: Benchmark one real SQL edit end to end
        run: npm run bench:query-edit -- --counts 25000
      - name: Enforce query-edit latency budget
        run: npm run bench:query-edit:assert -- --count 25000
